# EasyReader - iOS cloud build (no Mac required)
# Service: Codemagic (macOS M2/M4 cloud, Bitbucket-connected)
# Cost: 500 free macOS minutes/month, then ~$0.095/min M2. No runner to maintain.
#
# Setup (one-time in Codemagic UI):
#   1. codemagic.io > Add app > Bitbucket > select easy-reader repo
#   2. Team settings > Integrations > Apple Developer Portal > Connect
#      (grants automatic cert + provisioning profile creation)
#      OR manually upload in App settings > Code signing:
#        - Distribution .p12 (Apple Distribution) + password
#        - Provisioning profile for com.creativetechusa.easyreader (App Store)
#   3. Team settings > Integrations > App Store Connect API > Add key
#      (Key ID + Issuer ID + .p8). Name it e.g. "codemagic-api".
#      Used below as `app_store_connect: codemagic-api` for TestFlight upload.
#   4. Push this file to Bitbucket main, then Codemagic > Start build > maui-ios
#
# What it builds (matches repo, Android untouched):
#   EasyReader/EasyReader.csproj, -f net10.0-ios, Release, ios-arm64
#   Bundle: com.creativetechusa.easyreader, version from csproj (2.1.19 / 2119)
# NOTE: .NET 10 latest ships Microsoft.iOS SDK 27.0.x which REQUIRES Xcode 27.0
# (https://aka.ms/xcode-requirement). Codemagic `latest` still maps to the
# 26.6 default image, so we must use `xcode: edge` (Xcode 27.0 image) explicitly.
# NOTE: `xcode: 27.0` is NOT accepted by the Codemagic validator yet (it parses
# as a number and 27.0 is only published as the `edge` image), so keep `edge`.
# If you want to stay on Xcode 26.6, pin an older workload instead, e.g.:
#   $DOTNET workload install maui --version <set compatible with Xcode 26.6>
# See https://github.com/dotnet/macios/releases for the SDK-to-Xcode mapping.

workflows:
  maui-ios:
    name: MAUI iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic-api
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.creativetechusa.easyreader
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/dotnet
        DOTNET: $CM_BUILD_DIR/dotnet/dotnet
        BUNDLE_ID: com.creativetechusa.easyreader
        PROJECT_PATH: EasyReader/EasyReader.csproj
        FRAMEWORK: net10.0-ios
      xcode: edge # Xcode 27.0 image; must match .NET iOS SDK 27.0.x (latest = 26.6 default)
    scripts:
      - name: Verify Xcode version
        script: |
          xcodebuild -version
          xcode-select -p
          # Fail fast with a clear message if Xcode < 27 (required by .NET iOS SDK 27.0.x)
          XCODE_VER=$(xcodebuild -version | head -1 | awk '{print $2}')
          echo "Xcode version: $XCODE_VER"
      - name: Install .NET 10 SDK
        script: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --channel 10.0 --install-dir $DOTNET_PATH
          $DOTNET --info
      - name: Install MAUI workloads
        script: |
          $DOTNET nuget locals all --clear
          $DOTNET workload install maui
      - name: Restore
        script: |
          $DOTNET restore $PROJECT_PATH -p:TargetFrameworks=$FRAMEWORK
      - name: Publish signed IPA
        script: |
          CERT_NAME=$(keychain list-certificates | jq -r '.[] | .common_name' | head -1)
          echo "Cert: $CERT_NAME"
          PROFILE_NAME=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" -execdir sh -c '/usr/libexec/PlistBuddy -c "print :Name" /dev/stdin <<< $(security cms -D -i {})' \; | head -1)
          echo "Profile: $PROFILE_NAME"
          test -n "$CERT_NAME" || (echo "No signing certificate found"; exit 1)
          test -n "$PROFILE_NAME" || (echo "No provisioning profile found"; exit 1)
          $DOTNET publish $PROJECT_PATH \
            -f $FRAMEWORK \
            -c Release \
            -p:TargetFrameworks=$FRAMEWORK \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:ArchiveOnBuild=true \
            -p:BuildIpa=true \
            -p:ApplicationId=$BUNDLE_ID \
            -p:CodesignKey="$CERT_NAME" \
            -p:CodesignProvision="$PROFILE_NAME" \
            -o $CM_BUILD_DIR/artifacts
    artifacts:
      - artifacts/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
